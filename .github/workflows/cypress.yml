name: Cypress Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    name: Run API Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress API tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          headed: false
          record: false
          spec: "cypress/e2e/api/**"

      - name: Upload API artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-api-artifacts
          path: |
            cypress/screenshots
            cypress/videos

  web-tests:
    runs-on: ubuntu-latest
    name: Run Web Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress Web tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          headed: false
          record: false
          spec: "cypress/e2e/web/**"

      - name: Upload Web artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-web-artifacts
          path: |
            cypress/screenshots
            cypress/videos